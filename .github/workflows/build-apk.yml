name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev \
            wget
          pip install --upgrade pip

      - name: Install Buildozer
        run: pip install buildozer

      - name: Setup Android SDK manually
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          # 下载命令行工具
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools/latest
          # 调整目录结构（zip内为cmdline-tools/子目录）
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools" ]; then
            mv $ANDROID_HOME/cmdline-tools/latest/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
            rmdir $ANDROID_HOME/cmdline-tools/latest/cmdline-tools
          fi
          # 创建符号链接，让 Buildozer 在旧路径找到 sdkmanager
          ln -sfn $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools
          export PATH=$ANDROID_HOME/tools/bin:$PATH
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          # 自动接受所有许可证
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # 安装必要组件
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
          # 验证 aidl 存在
          if [ ! -f "$ANDROID_HOME/build-tools/30.0.3/aidl" ]; then
            echo "ERROR: aidl not found!" && exit 1
          fi
          echo "aidl installed at $ANDROID_HOME/build-tools/30.0.3/aidl"
          # 设置环境变量
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/tools/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/30.0.3" >> $GITHUB_PATH

      - name: Initialize Buildozer
        run: buildozer init

      - name: Configure Buildozer spec
        run: |
          # 基础配置
          sed -i 's/^title = .*/title = Modbus 解析/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = modbusparser/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.example/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.2.1/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,ttf/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          
          # 权限（空）
          sed -i '/^android.permissions =/d' buildozer.spec
          echo "android.permissions = " >> buildozer.spec
          
          # 架构与 API
          sed -i '/^android.arch =/d' buildozer.spec
          echo "android.arch = arm64-v8a" >> buildozer.spec
          sed -i '/^android.api =/d' buildozer.spec
          echo "android.api = 30" >> buildozer.spec
          sed -i '/^android.minapi =/d' buildozer.spec
          echo "android.minapi = 21" >> buildozer.spec
          
          # 日志级别
          sed -i '/^log_level =/d' buildozer.spec
          echo "log_level = 2" >> buildozer.spec
          
          # 指定 SDK 路径（Buildozer 会优先使用）
          sed -i '/^android.sdk_path =/d' buildozer.spec
          echo "android.sdk_path = $HOME/android-sdk" >> buildozer.spec
          sed -i '/^android.sdk.build_tools =/d' buildozer.spec
          echo "android.sdk.build_tools = 30.0.3" >> buildozer.spec
          sed -i '/^android.accept_sdk_license =/d' buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModbusParser-APK
          path: bin/*.apk
