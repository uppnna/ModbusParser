name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev \
            wget imagemagick
          pip install --upgrade pip

      - name: Install Buildozer & Cython
        run: pip install buildozer cython==0.29.33

      - name: Cache Buildozer files
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-cgi-fix-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-cgi-fix-

      - name: Initialize Buildozer
        run: buildozer init

      - name: Configure Buildozer spec
        run: |
          sed -i 's/^title = .*/title = Modbus 解析/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = modbusparser/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.example/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.2.1/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,ttf,png/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

          sed -i '/^android.accept_sdk_license =/d' buildozer.spec
          sed -i '/^android.skip_update =/d' buildozer.spec
          sed -i '/^android.permissions =/d' buildozer.spec
          sed -i '/^android.arch =/d' buildozer.spec
          sed -i '/^android.api =/d' buildozer.spec
          sed -i '/^android.minapi =/d' buildozer.spec
          sed -i '/^log_level =/d' buildozer.spec
          sed -i '/^android.sdk_path =/d' buildozer.spec
          sed -i '/^android.ndk_path =/d' buildozer.spec

          cat >> buildozer.spec << 'EOF'
          android.accept_sdk_license = True
          android.skip_update = False
          android.permissions = 
          android.arch = arm64-v8a
          android.api = 30
          android.minapi = 21
          log_level = 2
          EOF

      - name: Convert icon (if icon.ico exists)
        run: |
          if [ -f icon.ico ]; then
            echo ">> Converting icon.ico to icon.png..."
            convert icon.ico icon.png
            ls -l icon.png
            echo "icon.filename = %(source.dir)s/icon.png" >> buildozer.spec
          fi

      - name: First build attempt (download SDK and NDK)
        run: buildozer android debug || true

      - name: Fix SDK licenses and build-tools
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          echo ">> Fixing Android SDK at $SDK_DIR"

          if [ -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$SDK_DIR/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/tools/bin/sdkmanager"
          else
            echo ">> sdkmanager not found, downloading cmdline-tools..."
            mkdir -p "$SDK_DIR/cmdline-tools/latest"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline
            mv /tmp/cmdline/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
            rm -rf /tmp/cmdline /tmp/cmdline.zip
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"

          yes | $SDKMANAGER --licenses --sdk_root="$SDK_DIR" 2>/dev/null || true
          $SDKMANAGER "build-tools;30.0.3" --sdk_root="$SDK_DIR"
          $SDKMANAGER "platforms;android-30" --sdk_root="$SDK_DIR"
          $SDKMANAGER "platform-tools" --sdk_root="$SDK_DIR"

          if [ -f "$SDK_DIR/build-tools/30.0.3/aidl" ]; then
            echo "✅ aidl installed successfully"
          else
            echo "❌ aidl still missing!"
            find "$SDK_DIR" -name "aidl" 2>/dev/null
            exit 1
          fi

      - name: Inject cgi compatibility module for Python 3.14
        run: |
          # 找到 Kivy 构建时使用的 Python 3.14 的 site-packages 路径
          PYTHON314_DIR=$(find /home/runner/.buildozer -name "python3.14" -type d | grep "hostpython3" | head -1)
          if [ -n "$PYTHON314_DIR" ]; then
            SITE_PACKAGES="$PYTHON314_DIR/lib/python3.14/site-packages"
            echo ">> Found Python 3.14 at: $PYTHON314_DIR"
            echo ">> Injecting cgi.py into $SITE_PACKAGES..."
            sudo mkdir -p "$SITE_PACKAGES"
            echo "# Compatibility stub" | sudo tee "$SITE_PACKAGES/cgi.py" > /dev/null
            echo "✅ cgi.py injected successfully"
          else
            echo "⚠️ Python 3.14 directory not found, skipping cgi fix."
          fi

      - name: Build APK (final)
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModbusParser-APK
          path: bin/*.apk
