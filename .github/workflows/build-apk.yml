name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
          pip install --upgrade pip

      - name: Install Buildozer
        run: pip install buildozer

      - name: Initialize Buildozer
        run: buildozer init

      - name: Configure Buildozer spec
        run: |
          sed -i 's/^title = .*/title = Modbus 解析/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = modbusparser/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.example/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.2.1/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,ttf/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          sed -i '/^android.permissions =/d' buildozer.spec
          echo "android.permissions = " >> buildozer.spec
          echo "android.arch = arm64-v8a" >> buildozer.spec
          echo "android.api = 30" >> buildozer.spec
          echo "android.minapi = 21" >> buildozer.spec
          sed -i '/^log_level =/d' buildozer.spec   # 删除已有的 log_level
          echo "log_level = 2" >> buildozer.spec

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModbusParser-APK
          path: bin/*.apk
