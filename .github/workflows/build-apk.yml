name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev \
            wget imagemagick
          pip install --upgrade pip

      - name: Install Buildozer & Cython
        run: pip install buildozer cython==0.29.33

      - name: Cache Buildozer files
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v2-

      - name: Initialize Buildozer
        run: buildozer init

      - name: Configure Buildozer spec
        run: |
          sed -i 's/^title = .*/title = Modbus 解析/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = modbusparser/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.example/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.2.1/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,ttf,png/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

          # 清除所有默认项并写入简洁配置
          sed -i '/^android.accept_sdk_license =/d' buildozer.spec
          sed -i '/^android.skip_update =/d' buildozer.spec
          sed -i '/^android.permissions =/d' buildozer.spec
          sed -i '/^android.arch =/d' buildozer.spec
          sed -i '/^android.api =/d' buildozer.spec
          sed -i '/^android.minapi =/d' buildozer.spec
          sed -i '/^log_level =/d' buildozer.spec
          sed -i '/^android.sdk_path =/d' buildozer.spec
          sed -i '/^android.ndk =/d' buildozer.spec

          cat >> buildozer.spec << 'EOF'
          android.accept_sdk_license = True
          android.skip_update = False
          android.permissions = 
          android.arch = arm64-v8a
          android.api = 30
          android.minapi = 21
          log_level = 2
          EOF

      - name: Convert icon (if icon.ico exists)
        run: |
          if [ -f icon.ico ]; then
            echo ">> Converting icon.ico to icon.png..."
            convert icon.ico icon.png
            ls -l icon.png
            echo "icon.filename = %(source.dir)s/icon.png" >> buildozer.spec
          fi

      - name: Build APK
        run: |
          # 让 Buildozer 先下载 SDK（可能会失败在许可步骤，我们手动修复）
          buildozer android debug || true
          
          # 手动接受许可并安装正确的构建工具
          export SDK_PATH="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK_PATH" ]; then
            echo ">> Fixing Android SDK licenses and build-tools..."
            
            # 如果不存在 tools/bin，尝试寻找 sdkmanager
            if [ ! -f "$SDK_PATH/tools/bin/sdkmanager" ] && [ -d "$SDK_PATH/cmdline-tools" ]; then
              CMDLINE_DIR=$(find "$SDK_PATH/cmdline-tools" -name "bin" -type d | head -1)
              if [ -d "$CMDLINE_DIR" ]; then
                ln -sfn "$(dirname "$CMDLINE_DIR")" "$SDK_PATH/tools"
              fi
            fi
            
            export PATH="$SDK_PATH/tools/bin:$PATH"
            
            # 接受所有许可
            yes | sdkmanager --licenses --sdk_root="$SDK_PATH" 2>/dev/null || true
            
            # 安装构建工具 30.0.3（包含 aidl）
            sdkmanager "build-tools;30.0.3" --sdk_root="$SDK_PATH"
            sdkmanager "platforms;android-30" --sdk_root="$SDK_PATH"
            
            # 验证 aidl 是否存在
            if [ -f "$SDK_PATH/build-tools/30.0.3/aidl" ]; then
              echo "✅ aidl installed successfully"
            else
              echo "❌ aidl still missing, trying alternative..."
              sdkmanager "build-tools;33.0.2" --sdk_root="$SDK_PATH"
              if [ -f "$SDK_PATH/build-tools/33.0.2/aidl" ]; then
                echo "✅ aidl found in build-tools 33.0.2"
              fi
            fi
          fi
          
          # 再次构建（这次应该成功）
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModbusParser-APK
          path: bin/*.apk
