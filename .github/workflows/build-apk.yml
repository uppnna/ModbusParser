name: Build Python APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 预装系统依赖
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config gcc g++ make cmake libssl-dev python3-pip python3-venv libaidl2-java

      - name: 安装buildozer
        run: pip3 install buildozer

      - name: 静默同意Android许可并编译APK
        run: |
          yes | buildozer android debug
          
      - name: 上传APK安装包
        uses: actions/upload-artifact@v4
        with:
          name: ModbusParser-APK
          path: bin/*.apk
