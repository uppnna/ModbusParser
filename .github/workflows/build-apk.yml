name: Build Python APK
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动点击运行

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装系统编译依赖
        run: |
          sudo apt update -y
          sudo apt upgrade -y
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config gcc g++ make cmake libssl-dev python3-pip python3-venv libaidl2-java libffi-dev

      - name: 安装Buildozer
        run: |
          python3 -m pip install --upgrade pip
          pip3 install buildozer

      - name: 静默同意协议、编译安卓调试APK
        run: yes | buildozer android debug

      - name: 打包成品上传
        uses: actions/upload-artifact@v4
        with:
          name: ModbusParser-APK安装包
          path: bin/*.apk
